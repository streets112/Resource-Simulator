# Resource Simulator Configuration

simulation:
  width: 200
  height: 150
  timestep_ms: 100
  max_steps: 0
  simulation_speed: 1.0

environment:
  ocean_border_width: 5
  terrain_types:
    ocean:
      color: [30, 60, 180]
      resource_regen_rate: 0.0
      resource_capacity: 0
      passable: false
      mobility_prey: 0.0
      mobility_predator: 0.0
      visibility_prey: 0.0
      visibility_predator: 0.0
      resource_productivity: 0.0
    rock:
      color: [80, 80, 80]
      resource_regen_rate: 0.0
      resource_capacity: 0
      passable: true
      mobility_prey: 0.2
      mobility_predator: 0.25
      visibility_prey: 1.0
      visibility_predator: 1.0
      resource_productivity: 0.0
    plains:
      color: [180, 200, 100]
      resource_regen_rate: .6
      # Capacity is the ceiling on energy extractable per cell visit, because
      # consume_resource can only take what is there. Raising grazing_efficiency
      # cannot compensate: income per visit is min(intake, capacity), so once
      # capacity binds, efficiency stops mattering.
      #
      # Target: ~8-10 bites per cell at full grazing (54/step) before depletion.
      # Plains capacity 240 -> ~9 bites at full grazing efficiency.
      # Forest capacity 320 -> ~12 bites at full grazing (but with productivity 0.33).
      resource_capacity: 110
      passable: true
      mobility_prey: 1.0
      mobility_predator: 1.0
      visibility_prey: 1.0
      visibility_predator: 1.0
      resource_productivity: 1.0
      # Open ground: grazers are at home, rabbits are exposed.
      grazer_productivity: 1.0
      rabbit_productivity: 0.75
    forest:
      color: [60, 140, 60]
      resource_regen_rate: 0.10
      # Higher capacity but slower regen. Cover favours rabbits: they bank
      # their surplus here while grazers get a smaller share.
      resource_capacity: 160
      passable: true
      mobility_prey: 0.6
      mobility_predator: 0.7
      visibility_prey: 0.4
      visibility_predator: 0.6
      resource_productivity: 1.0
      grazer_productivity: 0.7
      rabbit_productivity: 1.1
    meadow:
      color: [100, 200, 90]
      # Grazer stronghold: lush, fast-regrowing pasture where grazers
      # extract a third more energy than on plains.
      resource_regen_rate: 0.5
      resource_capacity: 150
      passable: true
      mobility_prey: 1.0
      mobility_predator: 1.0
      visibility_prey: 1.0
      visibility_predator: 1.0
      resource_productivity: 1.0
      grazer_productivity: 1.3
      rabbit_productivity: 0.5
    scrub:
      color: [120, 125, 65]
      # Rabbit stronghold: dense cover with rich pickings for rabbits,
      # but slow going and poor grazing for grazers.
      resource_regen_rate: 0.25
      resource_capacity: 130
      passable: true
      mobility_prey: 0.8
      mobility_predator: 0.9
      visibility_prey: 0.7
      visibility_predator: 0.8
      resource_productivity: 1.0
      grazer_productivity: 0.5
      rabbit_productivity: 1.3
  terrain_distribution:
    rock: 0.10
    plains: 0.22
    forest: 0.38
    meadow: 0.22
    scrub: 0.18
  resource_diffusion_rate: 0.01
  regen_base_factor: 0.025
  depletion_threshold: 0.6
  depletion_suppression: 2.2
  min_regen_suppression: 0.25
  regen_blocked_by_grazing: true
  regen_block_threshold: 3
  depletion_signal_smoothing: 0.7

grazer:
  initial_count: 200
  max_energy: 1000
  energy_per_step: 5
  # Intake is planned as energy_from_resource * efficiency, but consume_resource
  # can only take what the cell holds. With plains capacity down to 14 a grazer
  # asking for 18 units on a half-depleted cell was capped at 7 and starved.
  # 18 still keeps the worst-case floor (18 * min_efficiency = 5.4) above the
  # metabolic cost of 5, which is what stops prey being stranded on bare ground.
  energy_from_resource: 18
  reproduction_min_age: 55
  reproduction_min_energy: 650
  reproduction_energy_cost: 0.45
  offspring_initial_energy: 200
  move_speed: 1
  gradient_weight: 0.7
  gradient_weight_std: 0.2
  vision_radius: 10
  herd_radius: 5
  separation_radius: 0.5
  herd_follow_chance: 0.7
  cohesion_weight: 0.4
  alignment_weight: 0.3
  separation_weight: 0.3
  flee_radius: 5
  flee_weight: 3.0
  min_efficiency: 0.3
  spawn_group_size: 14
  spawn_group_radius: 2
  # Grazers travel to fresh ground and stop to feed, like rabbits but with a
  # longer stride and a higher travel tolerance. Travel peak is
  # 18 * 0.25 = 4.5 < 5, so a journey always costs energy.
  migratory: true
  moving_efficiency: 0.25
  # A grazer needs 450 net energy between an offspring (200) and reproduction
  # (650). At x1.5 a typical cell yielded +2.0/step -> 225 steps, so grazers
  # averaged ~300/1000 energy and never reached the threshold.
  grazing_efficiency: 1
  graze_ratio_threshold: 0.5
  # Leave the cell when ratio drops below 30% (depleted but not empty)
  # so grazers move on to better cells instead of stripping to zero.
  migrate_ratio_threshold: 0.3
  graze_energy_target: 1.0
  graze_resume_energy: 0.7
  wander_energy_threshold: 0.98
  migrating_herd_weight: 2.5
  movement_energy_cost: 0.6
  flee_speed_multiplier: 1.3
  flee_cost_multiplier: 2.5
  grazing_move_multiplier: 0.667

rabbit:
  initial_count: 100
  max_energy: 400
  # Metabolism must exceed the best intake available while travelling, otherwise
  # rabbits never need to stop. Travelling yield peaks at
  # energy_from_resource * moving_efficiency = 6 * 0.25 = 1.5 < 5.
  energy_per_step: 5
  # Rabbits are scrub specialists: their grazing_efficiency (4.0) is
  # high, so energy_from_resource stays modest. In scrub the
  # productivity bonus (1.3) lifts the effective intake to
  # 6 * 4.0 * 1.3 = 31/step on full ground; on plains (0.75) the
  # same bite is taxed down to 18, which is what keeps them out of
  # grazer country.
  energy_from_resource: 6
  reproduction_min_age: 60
  reproduction_min_energy: 200
  reproduction_energy_cost: 0.60
  offspring_initial_energy: 120
  move_speed: 2
  gradient_weight: 0.9
  gradient_weight_std: 0.1
  vision_radius: 4
  herd_radius: 8
  separation_radius: 2
  herd_follow_chance: 0.85
  cohesion_weight: .8
  alignment_weight: 0.6
  separation_weight: 0.35
  flee_radius: 5
  flee_weight: 3.0
  min_efficiency: 0.3
  spawn_group_size: 16
  spawn_group_radius: 7
  migratory: true
  moving_efficiency: 0.25
  grazing_efficiency: 4.0
  graze_ratio_threshold: 0.5
  # Leave cell when depleted to ~30% rather than stripping to 12%
  migrate_ratio_threshold: 0.3
  graze_energy_target: 1.0
  graze_resume_energy: 0.7
  wander_energy_threshold: 0.95
  migrating_herd_weight: 3.0
  movement_energy_cost: 0.6
  flee_speed_multiplier: 1.3
  flee_cost_multiplier: 2.5
  grazing_move_multiplier: 0.667

predator:
  initial_count: 30
  max_energy: 800
  energy_per_step: 4
  # Reduced from 65 to make predators less voracious - they now get less energy per kill
  # which forces them to hunt more selectively and prevents overconsumption
  energy_from_prey: 100
  # Increased from 70 to slow reproduction - predators take longer to reach maturity
  reproduction_min_age: 120
  # Increased from 200 to require more energy reserves before reproducing
  reproduction_min_energy: 450
  # Increased from 0.25 to make reproduction more costly - parents invest more energy per offspring
  reproduction_energy_cost: 0.4
  # Reduced from 160 to give offspring a harder start
  offspring_initial_energy: 100
  move_speed: 1
  chase_radius: 7
  resource_sense_radius: 10
  spawn_group_size: 6
  spawn_group_radius: 8
  pack_radius: 10
  pack_hunt_chance: 0.6
  flank_chance: 0.4
  pack_wander_chance: 0.5
  pack_score_bonus: 3.0
  depleted_ratio_threshold: 0.3
  investigate_steps: 12
  investigate_threshold: 0.02
  vision_boost_on_investigate: 1.5
  movement_energy_cost: 0.1
  # Failed chases are what starved predators, not failed hunts: at 2.0 a
  # fruitless pursuit burned ~440 energy, over half a predator's body, while a
  # successful rabbit netted only ~70.
  # Chase speed is move_speed * chase_speed_multiplier. Grazers flee at
  # 1 * 1.3 = 1.3 cells/step, so a chase multiplier of 1.4 keeps the
  # predator's top speed at ~1.1x the prey's flee speed: it can run
  # down a feeding grazer but not one that is already fleeing, which
  # is what lets prey populations recover instead of being harvested.
  chase_speed_multiplier: 1.4
  chase_cost_multiplier: 1.1
  # Satiety system: predators only hunt when energy drops below this fraction
  # of max_energy. When satiated, they patrol toward high prey density areas.
  hunt_energy_threshold: 0.4
  # When satiated, patrol toward areas with highest prey concentration
  patrol_toward_prey: true
  # Scent tracking
  scent_radius: 20
  # Patrolling
  patrol_vision_range: 15
  patrol_speed: 0.5
  # Pack dynamics
  max_pack_size: 15
  split_push_distance: 8

carcass:
  decay_rate: 0.98
  min_energy: 1.0
  carcass_energy_fraction: 1.0
  # Lower divisor means a carcass is drained in fewer steps, so a kill is cashed
  # in at roughly half the metabolic burn of sitting on it. The drain rate
  # (energy_from_prey / divisor) must exceed predator metabolism (4/step) or
  # scavenging is net-negative and predators slowly starve.
  consumption_divisor: 4.0
  feed_radius: 1

visualization:
  cell_size: 8
  show_grid: true
  show_stats: false
  fps: 60
  window_width: 1404
  window_height: 768
  colors:
    grazer: [255, 255, 0]
    predator: [255, 100, 0]
    carcass: [255, 0, 0]
    rabbit: [255, 0, 255]
    carcass_outline: [255, 220, 220]
    # Predator detection outlines: blue = following a scent trail,
    # yellow = chasing prey it has spotted by sight.
    scent_outline: [120, 200, 255]
    sight_outline: [255, 255, 120]
    resource_low: [30, 30, 30]
    resource_high: [50, 255, 50]

output:
  headless: false
  export_interval: 1000
  export_path: "output/simulation_data.json"
  log_interval: 100