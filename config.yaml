# Resource Simulator Configuration

simulation:
  width: 200
  height: 200
  timestep_ms: 100
  max_steps: 0
  simulation_speed: 1.0

environment:
  ocean_border_width: 5
  terrain_types:
    ocean:
      color: [30, 60, 180]
      resource_regen_rate: 0.0
      resource_capacity: 0
      passable: false
      mobility_prey: 0.0
      mobility_predator: 0.0
      visibility_prey: 0.0
      visibility_predator: 0.0
    rock:
      color: [80, 80, 80]
      resource_regen_rate: 0.0
      resource_capacity: 0
      passable: true
      mobility_prey: 0.5
      mobility_predator: 0.3
      visibility_prey: 1.0
      visibility_predator: 1.0
    plains:
      color: [180, 200, 100]
      resource_regen_rate: 1.5
      resource_capacity: 30
      passable: true
      mobility_prey: 1.0
      mobility_predator: 1.0
      visibility_prey: 1.0
      visibility_predator: 1.0
    forest:
      color: [60, 140, 60]
      resource_regen_rate: 0.5
      resource_capacity: 150
      passable: true
      mobility_prey: 0.5
      mobility_predator: 0.75
      visibility_prey: 0.4
      visibility_predator: 0.6
  terrain_distribution:
    rock: 0.15
    plains: 0.30
    forest: 0.55
  resource_diffusion_rate: 0.1
  regen_base_factor: 0.025
  depletion_threshold: 0.6
  depletion_suppression: 2.2
  min_regen_suppression: 0.25
  depletion_signal_smoothing: 0.7

grazer:
  initial_count: 200
  max_energy: 1000
  energy_per_step: 5
  energy_from_resource: 18
  reproduction_min_age: 55
  reproduction_min_energy: 650
  reproduction_energy_cost: 0.45
  offspring_initial_energy: 200
  move_speed: 1
  gradient_weight: 0.7
  gradient_weight_std: 0.2
  vision_radius: 5
  herd_radius: 8
  separation_radius: 2
  herd_follow_chance: 0.7
  cohesion_weight: 0.4
  alignment_weight: 0.3
  separation_weight: 0.3
  flee_radius: 5
  flee_weight: 3.0
  min_efficiency: 0.3

rabbit:
  initial_count: 100
  max_energy: 400
  energy_per_step: 3
  energy_from_resource: 12
  reproduction_min_age: 35
  reproduction_min_energy: 240
  reproduction_energy_cost: 0.25
  offspring_initial_energy: 140
  move_speed: 1
  gradient_weight: 0.9
  gradient_weight_std: 0.1
  vision_radius: 4
  herd_radius: 6
  separation_radius: 2
  herd_follow_chance: 0.7
  cohesion_weight: 0.4
  alignment_weight: 0.3
  separation_weight: 0.3
  flee_radius: 5
  flee_weight: 3.0
  min_efficiency: 0.3

predator:
  initial_count: 30
  max_energy: 800
  energy_per_step: 6
  energy_from_prey: 260
  reproduction_min_age: 110
  reproduction_min_energy: 420
  reproduction_energy_cost: 0.4
  offspring_initial_energy: 140
  move_speed: 2
  chase_radius: 7
  resource_sense_radius: 10
  pack_radius: 10
  pack_hunt_chance: 0.6
  flank_chance: 0.4
  pack_wander_chance: 0.5
  pack_score_bonus: 3.0
  depleted_ratio_threshold: 0.3
  investigate_steps: 12
  investigate_threshold: 0.02
  vision_boost_on_investigate: 1.5

carcass:
  decay_rate: 0.98
  min_energy: 1.0
  carcass_energy_fraction: 1.0
  consumption_divisor: 8.0
  feed_radius: 1

visualization:
  cell_size: 8
  show_grid: true
  show_stats: true
  fps: 60
  window_width: 1024
  window_height: 768
  colors:
    grazer: [255, 255, 0]
    predator: [255, 100, 0]
    carcass: [255, 0, 0]
    rabbit: [255, 0, 255]
    resource_low: [30, 30, 30]
    resource_high: [50, 255, 50]

output:
  headless: false
  export_interval: 1000
  export_path: "output/simulation_data.json"
  log_interval: 100